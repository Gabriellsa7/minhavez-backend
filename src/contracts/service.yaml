    patch:
      tags:
        - Appointments
      summary: Cancel an appointment
      operationId: cancelAppointment
      description: Cancels a SCHEDULED appointment. Only allowed by the owning patient (or an admin), and only before noon of the day prior to the appointment.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the appointment
      responses:
        '200':
          description: Appointment canceled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          description: Appointment can no longer be canceled
