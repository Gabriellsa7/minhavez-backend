  /auth/forgot-password:
    post:
      tags:
        - Users
      summary: Request a password reset code
      operationId: forgotPassword
      description: Sends a 6-digit verification code to the given email if an account exists. Always returns a generic success response to avoid revealing whether the email is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Request accepted
