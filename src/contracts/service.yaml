openapi: 3.0.2
info:
  title: minha-vez
  description: This is a sample API to demonstrate OpenAPI specification.
  version: 1.0.0

tags:
  - name: Users
    description: User management operations
  - name: HealthUnits
    description: Health unit management operations
  - name: Patients
    description: Patient management operations
  - name: HealthProfessionals
    description: Health professional management operations
  - name: Queues
    description: Queue management operations
  - name: QueueItems
    description: Queue item management operations
  - name: Notifications
    description: Notification management operations
  - name: Appointments
    description: Appointment management operations
  - name: Exams
    description: Exam management operations
  - name: Infrastructure
    description: Infrastructure monitoring and queue operations

paths:
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      operationId: getUsers
      description: Retrieve a list of all users.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Users
      summary: Create a new user
      operationId: createUser
      description: Add a new user to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user by ID
      operationId: getUserById
      description: Retrieve a user by their unique ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Users
      summary: Update a user
      operationId: updateUser
      description: Update the information of an existing user by ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Users
      summary: Delete a user
      operationId: deleteUser
      description: Delete an existing user by ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{id}/image:
    post:
      tags:
        - Users
      summary: Upload a user profile image
      operationId: uploadUserImage
      description: Upload an image to Cloudinary and attach the resulting URL to the user as their avatar.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUserImage'
      responses:
        '200':
          description: User profile image uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health-units:
    get:
      tags:
        - HealthUnits
      summary: Get all health units
      operationId: getHealthUnits
      description: Retrieve a list of all health units.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Free-text search term to filter health units by name, description or address
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page number. When omitted (together with limit), the full unpaginated list is returned.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Items per page (default 10 when page or limit is provided).
      responses:
        '200':
          description: A paginated list of health units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHealthUnits'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - HealthUnits
      summary: Create a new health unit
      operationId: createHealthUnit
      description: Add a new health unit to the database. Restricted to Admin, who defines whether the unit is public or private at creation time.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHealthUnit'
      responses:
        '201':
          description: Health unit created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnit'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health-units/user/{userId}:
    get:
      tags:
        - HealthUnits
      summary: Get health units created by a user
      operationId: getHealthUnitsByUserId
      description: Retrieve all health units created by the specified user.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user who created the health units
      responses:
        '200':
          description: A list of health units created by the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthUnit'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health-units/{id}/image:
    post:
      tags:
        - HealthUnits
      summary: Upload a health unit image
      operationId: uploadHealthUnitImage
      description: Upload an image to Cloudinary and attach the resulting URL to the health unit. Restricted to Admin.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the health unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadHealthUnitImage'
      responses:
        '200':
          description: Health unit image uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnit'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Health unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health-units/{id}:
    get:
      tags:
        - HealthUnits
      summary: Get a health unit by ID
      operationId: getHealthUnitById
      description: Retrieve a health unit by its unique ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the health unit
      responses:
        '200':
          description: Health unit found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnit'
        '404':
          description: Health unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - HealthUnits
      summary: Update a health unit
      operationId: updateHealthUnit
      description: Update the information of an existing health unit by ID. Restricted to Admin.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the health unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHealthUnit'
      responses:
        '200':
          description: Health unit updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnit'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Health unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - HealthUnits
      summary: Delete a health unit
      operationId: deleteHealthUnit
      description: Delete an existing health unit by ID. Restricted to Admin.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: The ID of the health unit
      responses:
        '200':
          description: Health unit deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Health unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /patients:
    get:
      tags:
        - Patients
      summary: Get all patients
      operationId: getPatients
      description: Retrieve a list of all patients.
      responses:
        '200':
          description: A list of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Patients
      summary: Create a new patient
      operationId: createPatient
      description: Add a new patient to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatient'
      responses:
        '201':
          description: Patient created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /patients/{id}:
    get:
      tags:
        - Patients
      summary: Get a patient by ID
      operationId: getPatientById
      description: Retrieve a patient by their unique ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the patient
      responses:
        '200':
          description: Patient found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Patients
      summary: Update a patient
      operationId: updatePatient
      description: Update the information of an existing patient by ID. Restricted to the patient themself.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatient'
      responses:
        '200':
          description: Patient updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to update this patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Patients
      summary: Delete a patient
      operationId: deletePatient
      description: Delete an existing patient by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the patient
      responses:
        '200':
          description: Patient deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /patients/{id}/documents:
    post:
      tags:
        - Patients
      summary: Attach a medical proof document to a patient
      operationId: uploadPatientMedicalDocument
      description: Patient self-uploads a PDF or image (e.g. proof of a chronic condition/disease) securely. Restricted to the patient themself.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadPatientMedicalDocument'
      responses:
        '201':
          description: Document attached successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          description: Bad request (unsupported file type or file too large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to update this patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /patients/{id}/documents/{documentId}:
    delete:
      tags:
        - Patients
      summary: Remove a medical proof document from a patient
      operationId: removePatientMedicalDocument
      description: Restricted to the patient themself.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the patient
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the medical document
      responses:
        '200':
          description: Document removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to update this patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Patient or document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /patients/{id}/documents/{documentId}/download:
    get:
      tags:
        - Patients
      summary: Get a signed download URL for a patient's medical document
      operationId: downloadPatientMedicalDocument
      description: Returns a freshly-generated signed URL to view/download the document. Restricted to the patient themself.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the patient
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the medical document
      responses:
        '200':
          description: Signed URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMedicalDocumentDownloadUrl'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to access this patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Patient or document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /patients/user/{userId}:
    get:
      tags:
        - Patients
      summary: Get a patient by user ID
      operationId: getPatientByUserId
      description: Retrieve a patient by their associated user ID.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The user ID associated with the patient
      responses:
        '200':
          description: Patient found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /patients/cpf/{cpf}:
    get:
      tags:
        - Patients
      summary: Get a patient by CPF
      operationId: getPatientByCpf
      description: Retrieve a patient by their CPF. Used by clinic admins to look up a patient before registering an exam.
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
          description: The CPF of the patient, with or without punctuation
      responses:
        '200':
          description: Patient found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health-professionals:
    get:
      tags:
        - HealthProfessionals
      summary: Get all health professionals
      operationId: getHealthProfessionals
      description: Retrieve a list of all health professionals.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Free-text search term to filter health professionals by name or specialty
        - name: specialty
          in: query
          required: false
          schema:
            type: string
          description: Filter health professionals by exact specialty
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page number. When omitted (together with limit), the full unpaginated list is returned.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Items per page (default 10 when page or limit is provided).
      responses:
        '200':
          description: A paginated list of health professionals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHealthProfessionals'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - HealthProfessionals
      summary: Create a new health professional
      operationId: createHealthProfessional
      description: Add a new health professional to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHealthProfessional'
      responses:
        '201':
          description: Health professional created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProfessional'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health-professionals/{id}:
    get:
