  /patients/{id}/appointments:
    get:
      tags:
        - Appointments
      summary: List appointments for a patient
      operationId: getAppointmentsByPatient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Patient ID
        - name: status
          in: query
          required: false
          style: form
          explode: false
          allowReserved: true
          schema:
            type: array
            items:
              type: string
              enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELED]
          description: Comma-separated list of appointment statuses to filter by (e.g. "COMPLETED,CANCELED")
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page number. When omitted (together with limit), the full unpaginated list is returned.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Items per page (default 10 when page or limit is provided).
      responses:
        '200':
          description: Paginated appointments belonging to the patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointments'
        '404':
          description: Patient not found
          content:
