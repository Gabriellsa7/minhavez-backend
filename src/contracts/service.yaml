              schema:
                $ref: '#/components/schemas/Error'
  /exam-bookings/{id}/reschedule:
    patch:
      tags:
        - ExamScheduling
      summary: Reschedule an exam booking
      operationId: rescheduleExamBooking
      description: Implemented as cancel-current + create-new against the same offering/clinic, re-running the full availability and capacity checks.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleExamBooking'
      responses:
        '200':
          description: Booking rescheduled (a new booking replaces the old one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamBooking'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: New slot is fully booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /exam-bookings/{id}/status:
    patch:
      tags:
        - ExamScheduling
      summary: Staff transitions a booking's status
      operationId: updateExamBookingStatus
      description: Staff-only. Valid transitions are SCHEDULED/CONFIRMED -> IN_PROGRESS, IN_PROGRESS -> COMPLETED, SCHEDULED/CONFIRMED -> NO_SHOW (only after scheduledAt has passed). Cancellation uses the /cancel endpoint instead.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExamBookingStatus'
      responses:
        '200':
          description: Booking status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamBooking'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /exam-bookings/{id}/link-result:
    patch:
      tags:
        - ExamScheduling
      summary: Link an uploaded exam result to a completed booking
      operationId: linkExamBookingResult
      description: Alternative to passing examBookingId on POST /exams — links after the fact.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - examId
              properties:
                examId:
                  type: string
      responses:
        '204':
          description: Linked successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Booking or exam not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

